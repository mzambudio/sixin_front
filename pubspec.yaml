name: sixin_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  image_picker: ^1.0.0
  crypto: ^3.0.3
  http: ^1.2.0
  shared_preferences: ^2.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false

  # Icono normal / legacy
  image_path: "assets/icon/sixin_black.png"

  # Icono adaptativo Android
  adaptive_icon_foreground: "assets/icon/sixin_black.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/sixin_white.png
    - assets/icon/sixin_black.png